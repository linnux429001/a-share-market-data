name: Offline trade risk audit tests
on:
  workflow_dispatch:
  push:
    branches: [feature/trade-risk-audit]
    paths:
      - 'trade_risk_audit.py'
      - 'test_trade_risk_audit.py'
      - '.github/workflows/trade-risk-tests.yml'
  pull_request:
    paths:
      - 'trade_risk_audit.py'
      - 'test_trade_risk_audit.py'
      - '.github/workflows/trade-risk-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_trade_risk_audit.py
