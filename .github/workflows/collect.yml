name: Collect A-share market snapshot
on:
  workflow_dispatch:
  schedule:
    # UTC. Beijing time: 09:25–11:30 and 13:00–15:00, every five minutes.
    - cron: '25-55/5 1 * * 1-5'
    - cron: '*/5 2,5,6 * * 1-5'
    - cron: '0-30/5 3 * * 1-5'
    - cron: '0 7 * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-snapshot-main
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect market snapshot
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            date_cn=$(TZ=Asia/Shanghai date +%F)
            # SSE published calendar: https://www.sse.com.cn/disclosure/dealinstruc/closed/
            case "$date_cn" in
              2026-01-0[1-3]|2026-02-1[5-9]|2026-02-2[0-3]|2026-04-0[4-6]|2026-05-0[1-5]|2026-06-1[9]|2026-06-2[01]|2026-09-2[5-7]|2026-10-0[1-7])
                echo "Exchange closed: $date_cn"
                exit 0
                ;;
              2026-*) ;;
              *) echo "::error::Update the verified exchange calendar for $date_cn"; exit 1 ;;
            esac
          fi
          python collect.py
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          for group in ('industry', 'concept'):
              rows = snapshot[group]['top']
              if not rows or not all(row.get('code') and row.get('name') for row in rows):
                  raise ValueError(f'Invalid {group} board data')
          stocks = snapshot['watchlist']
          if {stock.get('code') for stock in stocks} != {'300364', '603533'} or any(
              not stock.get('name') or type(stock.get('price')) not in (int, float)
              or type(stock.get('change_pct')) not in (int, float) for stock in stocks
          ):
              raise ValueError('Invalid watchlist data')
          PY
      - name: Commit updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update market snapshot'
            git push
          fi
