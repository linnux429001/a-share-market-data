name: Priority stock quotes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'priority_quotes.py'
      - 'config/watchlist.json'
      - '.github/workflows/priority-quotes.yml'
  schedule:
    # Beijing time 09:30-11:30, 13:00-15:00, weekdays
    - cron: '30-55/5 1 * * 1-5'
    - cron: '*/5 2,5,6 * * 1-5'
    - cron: '0-30/5 3 * * 1-5'
    - cron: '0 7 * * 1-5'
permissions:
  contents: write
concurrency:
  group: priority-quotes-main
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect priority quotes
        run: python priority_quotes.py
      - name: Commit quotes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/priority_quotes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update priority quotes'
            git pull --rebase origin main
            git push
          fi
